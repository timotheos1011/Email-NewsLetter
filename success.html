<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Success</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        display: grid;
        place-items: center;
        height: 100vh;
        margin: 0;
      }
      .card {
        background: white;
        padding: 2rem 3rem;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        text-align: center;
      }
      h1 {
        color: #198754;
      }
      a {
        display: inline-block;
        margin-top: 1rem;
        text-decoration: none;
        background: #0d6efd;
        color: white;
        padding: 0.75rem 1.5rem;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Success!</h1>
      <p>You have been subscribed to the newsletter.</p>
      <a href="/">Back to signup</a>
    </div>
  </body>
</html>
